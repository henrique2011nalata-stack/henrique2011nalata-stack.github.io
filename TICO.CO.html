<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TICO.CO | TicoOS Hyprland</title>
    <style>
        /* CONFIGURAÇÃO DE VARIÁVEIS FISICAS DO SISTEMA */
        :root {
            --bg-principal: #ffffff;
            --texto-principal: #1a1a1a;
            --texto-secundario: #555555;
            --bg-card: #f8f9fa;
            --titulo-card: #000000;
            --borda-comum: #e5e5e5;
            --azul-arch: #1793d1;
            --roxo-discord: #5865F2;
        } 
        
        [data-theme="dark"] {
            --bg-principal: #0d0f14;
            --texto-principal: #cdd6f4;
            --texto-secundario: #a6adc8;
            --bg-card: #181825;
            --titulo-card: #ffffff;
            --borda-comum: #313244;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--borda-comum);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--azul-arch);
            letter-spacing: 1px;
        }

        /* BOTÃO DE ALTERNÂNCIA (MODO ESCURO / CLARO) */
        .theme-toggle {
            background-color: var(--bg-card);
            color: var(--texto-principal);
            border: 2px solid var(--azul-arch);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--azul-arch);
            color: #ffffff;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 20px;
            color: var(--texto-secundario);
            margin-bottom: 40px;
        }

        .btn-download {
            background-color: var(--azul-arch);
            color: #ffffff;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0px 4px 15px rgba(23, 147, 209, 0.3);
            display: inline-block;
            margin-bottom: 15px;
        }

        .btn-download:hover {
            background-color: #0f70a1;
            box-shadow: 0px 6px 25px rgba(23, 147, 209, 0.6);
            transform: scale(1.05);
        }

        /* BOTÃO DO DISCORD */
        .btn-discord {
            background-color: var(--roxo-discord);
            color: #ffffff;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0px 4px 15px rgba(88, 101, 242, 0.3);
            display: inline-block;
        }

        .btn-discord:hover {
            background-color: #4752c4;
            box-shadow: 0px 6px 25px rgba(88, 101, 242, 0.6);
            transform: scale(1.05);
        }

        .features {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            padding: 40px 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--azul-arch);
            padding: 25px;
            border-radius: 8px;
            width: 280px;
            text-align: left;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card h3 {
            color: var(--titulo-card);
            margin-top: 0;
            font-size: 20px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.5;
            color: var(--texto-secundario);
        }

        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 14px;
            color: #aaaaaa;
            border-top: 1px solid var(--borda-comum);
            width: 100%;
            text-align: center;
        }

        .sobre-nos {
            max-width: 1000px;
            padding: 60px 20px;
            text-align: center;
            border-top: 2px solid var(--borda-comum);
            width: 100%;
        }

        .sobre-nos h3 {
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--titulo-card);
        }

        .sobre-nos p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--texto-secundario);
            max-width: 800px;
            margin: 0 auto;
        }

        .convite-discord {
            margin-top: 25px;
            font-weight: bold;
        }

        .convite-discord a {
            color: var(--roxo-discord);
            text-decoration: none;
        }

        .convite-discord a:hover {
            text-decoration: underline;
        }
    </style>
</head>

        <div class="logo">TICO.CO</div>
        <div style="display: flex; align-items: center; gap: 20px;">
